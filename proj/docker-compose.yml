version: "3.8"

services:
  backend:
    build: ./backend
    container_name: proj-backend
    ports:
      - "8080:3000"     # снаружи 8080, внутри 3000
    environment:
      - PORT=3000
    restart: always
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: proj-db
    restart: always
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=appdb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
